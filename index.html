<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yova TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Logo réutilisable -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="yg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff4fa3"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#2ee6ff"/>
      </linearGradient>
      <symbol id="yova-mark" viewBox="0 0 64 64">
        <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#yg)"/>
        <path d="M19 17 L32 34 L45 17" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 34 V48" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
        <circle cx="46" cy="46" r="4" fill="#fff" opacity=".9"/>
      </symbol>
    </defs>
  </svg>

  <!-- Fond aurore qui prend la couleur de la chaîne sélectionnée -->
  <div id="aurora"><i></i><i></i><i></i></div>
  <div id="grain"></div>

  <!-- Écran de démarrage -->
  <div id="boot">
    <div class="boot-logo"><svg><use href="#yova-mark"/></svg><div class="boot-ring"></div></div>
    <div class="boot-name">yova<b>tv</b></div>
    <div class="boot-tag">Le monde entier, en direct</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <!-- Menu latéral -->
  <aside id="rail">
    <div class="rail-logo"><svg><use href="#yova-mark"/></svg></div>
    <nav id="nav">
      <button class="nav-btn focusable" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
      <button class="nav-btn focusable" data-nav="apps"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>Applis</span></button>
      <button class="nav-btn focusable kids" data-nav="kids"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><circle cx="5.5" cy="6" r="3"/><circle cx="18.5" cy="6" r="3"/><circle cx="9.2" cy="12" r="1.3" fill="#05060d"/><circle cx="14.8" cy="12" r="1.3" fill="#05060d"/><path d="M9 15.5c1.6 1.6 4.4 1.6 6 0" fill="none" stroke="#05060d" stroke-width="1.6" stroke-linecap="round"/></svg><span>Enfants</span></button>
      <button class="nav-btn focusable" data-nav="arab"><svg viewBox="0 0 24 24"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 15.4A9 9 0 0 1 15.5 3.5z"/><path d="m18 6 .7 1.6 1.8.2-1.3 1.2.4 1.8-1.6-.9-1.6.9.4-1.8-1.3-1.2 1.8-.2z"/></svg><span>Arabe</span></button>
      <button class="nav-btn focusable" data-nav="world"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2"/><path fill="none" stroke-width="2" d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span>Monde</span></button>
      <button class="nav-btn focusable" data-nav="favs"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Favoris</span></button>
      <button class="nav-btn focusable roulette" data-nav="roulette"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8" cy="8" r="1.6" fill="#0b0d1a"/><circle cx="16" cy="16" r="1.6" fill="#0b0d1a"/><circle cx="12" cy="12" r="1.6" fill="#0b0d1a"/><circle cx="16" cy="8" r="1.6" fill="#0b0d1a"/><circle cx="8" cy="16" r="1.6" fill="#0b0d1a"/></svg><span>Roulette</span></button>
    </nav>
  </aside>

  <div id="main">
    <!-- Barre du haut -->
    <header id="topbar">
      <div class="brand">yova<b>tv</b></div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke-width="2.4"/><path d="m20 20-3.5-3.5" stroke-width="2.4" stroke-linecap="round"/></svg>
        <input id="search" class="focusable" type="search" placeholder="Chaîne, pays, appli…" autocomplete="off">
      </div>
      <div class="clockbox"><div id="clock"></div><div id="date"></div></div>
    </header>

    <!-- Zone vedette : aperçu en direct de l'élément sélectionné -->
    <section id="hero">
      <video id="preview" muted playsinline></video>
      <div class="hero-shade"></div>
      <div class="hero-info">
        <div id="hero-kicker" class="kicker">Chargement</div>
        <h1 id="hero-title">Yova TV</h1>
        <p id="hero-meta">Des milliers de chaînes du monde entier.</p>
        <div id="hero-tags"></div>
      </div>
      <div id="hero-logo"></div>
    </section>

    <!-- Contenu (rangées ou grille) -->
    <main id="content"></main>
  </div>

  <!-- Lecteur plein écran -->
  <div id="player" hidden>
    <video id="video" playsinline></video>
    <div id="osd">
      <div class="osd-top">
        <div id="osd-num"></div>
        <div id="osd-logo"></div>
        <div class="osd-text">
          <div id="osd-name"></div>
          <div id="osd-sub"></div>
        </div>
        <div id="osd-live"><span></span>EN DIRECT</div>
      </div>
      <div class="osd-help"><kbd>▲▼</kbd> zapper <kbd>◀▶</kbd> volume <kbd>OK</kbd> infos <kbd>F</kbd> favori <kbd>Échap</kbd> retour</div>
    </div>
    <div id="player-status"></div>
    <div id="zapper"></div>
  </div>

  <!-- YouTube Enfants -->
  <div id="ytp" hidden>
    <iframe title="YouTube Enfants" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <div class="ytp-bar"><span id="ytp-name"></span><span class="ytp-help"><kbd>▲▼</kbd> autre chaîne <kbd>Échap</kbd> retour</span></div>
  </div>

  <!-- Roulette -->
  <div id="roulette" hidden>
    <div class="roulette-box">
      <div class="roulette-kicker">Roulette mondiale</div>
      <div id="roulette-flag">🌍</div>
      <div id="roulette-country">Tour du monde…</div>
      <div id="roulette-channel"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
